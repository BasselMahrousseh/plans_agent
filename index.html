<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <meta name="description" content="e& Package Advisor asks smart questions and recommends the mobile packages that best fit each customer.">
  <title>e&amp; Package Advisor</title>

  <!-- MediaPipe -->
  <script src="lib/camera_utils.js"></script>
  <script src="lib/hands.js"></script>

  <!-- p5.js -->
  <script src="lib/p5.js"></script>

  <!-- QR code rendering -->
  <script src="lib/qrcode.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <video id="video" autoplay muted playsinline></video>

  <!-- e& branded UI layer -->
  <div id="brandLayer">
    <div id="logoBadge">
      <img src="icons/eand-logo.png" alt="e& Package Advisor logo">
      <span>e& Package Advisor</span>
    </div>

    <div id="statusPill">Package Advisor Ready</div>
  </div>

  <!-- e& camera frame -->
  <div id="cameraFrame">
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>
  </div>

  <div id="qrPanel">
    <div id="qrCode"></div>
    <span id="qrLabel"></span>
  </div>

  <div id="planTypeControls" aria-label="Choose a plan type">
    <button class="planTypeButton home" type="button" data-plan-type="home">
      <span class="planTypeIcon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none"><path d="M9 31.5h30v7.25a3.25 3.25 0 0 1-3.25 3.25H12.25A3.25 3.25 0 0 1 9 38.75V31.5Z"/><path d="M15 31.5v-4.25a9 9 0 0 1 18 0v4.25"/><path d="M24 12.5v5M17 17.5l3.5 3.5M31 17.5 27.5 21"/><circle cx="17" cy="36.5" r="1.25" fill="currentColor"/><circle cx="31" cy="36.5" r="1.25" fill="currentColor"/></svg>
      </span>
      <span class="planTypeButtonLabel"></span>
    </button>
    <button class="planTypeButton mobile" type="button" data-plan-type="mobile">
      <span class="planTypeIcon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none"><rect x="15" y="7" width="18" height="34" rx="3"/><path d="M21 11h6M22 36h4"/></svg>
      </span>
      <span class="planTypeButtonLabel"></span>
    </button>
  </div>

  <script src="detection.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
