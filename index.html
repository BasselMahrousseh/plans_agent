<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <meta name="description" content="e& Package Advisor asks smart questions and recommends the mobile packages that best fit each customer.">
  <title>e&amp; Package Advisor</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.2.0/p5.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <video id="video" autoplay muted playsinline></video>

  <!-- e& branded UI layer -->
  <div id="brandLayer">
    <div id="logoBadge">
      <img src="eand-logo.png" alt="e& Package Advisor logo">
      <span>e& Package Advisor</span>
    </div>

    <div id="statusPill">Package Advisor Ready</div>
  </div>

  <!-- e& camera frame -->
  <div id="cameraFrame">
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>
  </div>

  <button id="restartButton" type="button" aria-label="Start a new package match">
    <span>Start a new match</span>
    <span aria-hidden="true">↻</span>
  </button>

  <script src="detection.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
